services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: trailweaver_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailweaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailweaver_secret}
      POSTGRES_DB: ${POSTGRES_DB:-trailweaver_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trailweaver} -d ${POSTGRES_DB:-trailweaver_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Application ───────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trailweaver_web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
